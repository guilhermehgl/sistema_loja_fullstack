name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop, 'portfolio/**']
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: Backend e PostgreSQL isolado
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: loja_ci
          POSTGRES_PASSWORD: temporary_ci_only
          POSTGRES_DB: sistema_loja_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U loja_ci -d sistema_loja_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql://loja_ci:temporary_ci_only@127.0.0.1:5432/sistema_loja_test
      TEST_DATABASE_ISOLATED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --runInBand
      - run: npm run test:e2e
      - run: npm run build
  frontend:
    name: Frontend testes e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build
        env:
          FRONTEND_API_URL: http://localhost:3000
          FRONTEND_API_URL_PROD: https://sistema-loja-fullstack.onrender.com
